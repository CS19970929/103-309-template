name: C073 Keil Build

on:
  push:
    branches:
      - fix/c073-current-zero-calibration-diagnostics

jobs:
  keil-build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FD_Release
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\bms_dev_workflow.ps1 -Mode build -Target FD_Release
